plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.sunwoo.easyledger'
    compileSdk 36

    defaultConfig {
        applicationId 'com.sunwoo.easyledger'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '1.1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // AdMob: 기본은 Google 테스트 ID. 실제 출시 전 local.properties에 넣어 교체.
        // admob.appId=ca-app-pub-xxxx~yyyy
        // admob.bannerId=...
        // admob.interstitialId=...
        // admob.rewardedId=...
        def localProps = new Properties()
        def localFile = rootProject.file('local.properties')
        if (localFile.exists()) {
            localProps.load(new FileInputStream(localFile))
        }
        buildConfigField 'String', 'ADMOB_APP_ID', "\"${localProps.getProperty('admob.appId', 'ca-app-pub-3940256099942544~3347511713')}\""
        buildConfigField 'String', 'ADMOB_BANNER_ID', "\"${localProps.getProperty('admob.bannerId', 'ca-app-pub-3940256099942544/6300978111')}\""
        buildConfigField 'String', 'ADMOB_INTERSTITIAL_ID', "\"${localProps.getProperty('admob.interstitialId', 'ca-app-pub-3940256099942544/1033173712')}\""
        buildConfigField 'String', 'ADMOB_REWARDED_ID', "\"${localProps.getProperty('admob.rewardedId', 'ca-app-pub-3940256099942544/5224354917')}\""
        manifestPlaceholders = [admobAppId: localProps.getProperty('admob.appId', 'ca-app-pub-3940256099942544~3347511713')]
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        'room.schemaLocation' : "$projectDir/schemas".toString(),
                        'room.incremental'    : 'true'
                ]
            }
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.fragment:fragment:1.8.4'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.8.3'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.google.guava:guava:31.1-android'
    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'

    testImplementation 'junit:junit:4.13.2'
}
